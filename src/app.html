<title>מצפן בר־אילן</title>
<meta name="description" content="השיעור הבא, מסלול הליכה וזמן הגעה בקמפוס בר־אילן">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: sticker-sheet. A dotted butter page, white cards with chunky ink outlines and offset shadows.
   Phones: greeting, next-class card, day, search, map. Wide screens: the panel beside a sticky map. */
:root {
  /* palette: colorhunt.co most-liked orange (#ffdcdc #fff2eb #ffe8cd #ffd6ba) + a deeper orange of the same hue for actions */
  --paper: #fff2eb; --dot: #ffd6ba; --card: #ffffff; --soft: #ffe8cd; --ink: #3b2316; --muted: #8a6450; --edge: #3b2316; --hair: #ffdcdc;
  --coral: #f4762a; --coral-ink: #ffffff; --grape: #d9541a; --grape-ink: #ffffff; --lemon: #ffd6ba; --mint: #2ccb9a; --sky: #4db3ff;
  --lawn: #ffe8cd; --lawn-edge: #ffd6ba; --walk: #ffffff; --road: #ffdcdc; --bldg: #fff2eb; --bldg-edge: #3b2316;
  --route: #f4762a; --you: #3b2316;
  --ok: #0c7a55; --warn: #8a5a00; --late: #c21e3a; --ok-bg: #d3f6e7; --warn-bg: #fff0bf; --late-bg: #ffe0e6;
  --f-display: "Fredoka", "Rubik", "Arial Hebrew", sans-serif;
  --f-body: "Rubik", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
  --r: 22px; --stick: 4px 5px 0 var(--edge); --stick-sm: 2px 3px 0 var(--edge);
  /* building areas, colours taken from the official campus map */
  --a-exact: #ffcf3f; --a-jewish: #ff9a4a; --a-heritage: #2fc3bb; --a-classroom: #ff7466; --a-law: #4aa9ff;
  --a-student: #ff5fa8; --a-communal: #33c26d; --a-social: #95d84c; --a-humanities: #b685ff;
  --a-engineering: #d6c93c; --a-community: #e3bf93; --a-dorms: #ff84c1; --a-park: #26a866;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1f140f; --dot: #33231a; --card: #2b1c14; --soft: #3a271c; --ink: #fff2eb; --muted: #d9b8a3; --edge: #0d0705; --hair: #4a3326;
  --coral: #ff8a4c; --grape: #f0692b; --lemon: #ffd6ba;
  --lawn: #33251b; --lawn-edge: #4a3326; --walk: #5a4031; --road: #4a3326; --bldg: #3d2b20; --bldg-edge: #0d0705;
  --route: #ff8a4c; --you: #ffe8cd;
  --ok: #7ef0c0; --warn: #ffd772; --late: #ff9aab; --ok-bg: #173c33; --warn-bg: #3f3214; --late-bg: #47202d;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #1f140f; --dot: #33231a; --card: #2b1c14; --soft: #3a271c; --ink: #fff2eb; --muted: #d9b8a3; --edge: #0d0705; --hair: #4a3326;
  --coral: #ff8a4c; --grape: #f0692b; --lemon: #ffd6ba;
  --lawn: #33251b; --lawn-edge: #4a3326; --walk: #5a4031; --road: #4a3326; --bldg: #3d2b20; --bldg-edge: #0d0705;
  --route: #ff8a4c; --you: #ffe8cd;
  --ok: #7ef0c0; --warn: #ffd772; --late: #ff9aab; --ok-bg: #173c33; --warn-bg: #3f3214; --late-bg: #47202d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background-color: var(--paper); color: var(--ink); }
body { direction: rtl; font: 16px/1.5 var(--f-body); padding-inline: 16px; padding-block: 16px 48px;
  background-image: radial-gradient(var(--dot) 1.3px, transparent 1.6px); background-size: 22px 22px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 20px; }
@media (min-width: 900px) {
  .wrap { grid-template-columns: minmax(360px, 430px) 1fr; align-items: start; }
  .mapcol { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .mapbox { height: calc(100vh - 110px) !important; }
}
.panel, .mapcol, .next, .row, .from { min-width: 0; }
.panel { display: grid; gap: 20px; }
.note { font-size: 13px; color: var(--muted); }

/* greeting */
header.top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.sun { width: 54px; height: 54px; animation: spin 24s linear infinite; }
.hello h1 { font: 700 30px/1.1 var(--f-display); margin: 0; text-wrap: balance; }
.hello p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.hello p b { color: var(--ink); font-weight: 500; }
@keyframes spin { to { transform: rotate(360deg); } }

/* buttons */
.btn { border: 2px solid var(--edge); background: var(--card); color: var(--ink); border-radius: 999px; padding: 9px 18px; cursor: pointer;
  font: 600 16px/1.2 var(--f-display); box-shadow: 0 3px 0 var(--edge); transition: transform .08s, box-shadow .08s; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--edge); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.btn.primary { background: var(--coral); color: var(--coral-ink); }
.btn.small { padding: 6px 14px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn svg { width: 18px; height: 18px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--grape); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }


/* next class card */
.next { background: var(--card); border: 2px solid var(--edge); border-radius: var(--r); box-shadow: var(--stick); padding: 18px; display: grid; gap: 14px;
  animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { from { transform: scale(.97) rotate(-.4deg); } }
.eyebrow { justify-self: start; font: 600 13px/1 var(--f-display); letter-spacing: .02em; background: var(--lemon); color: #3b2316; border: 2px solid var(--edge);
  border-radius: 999px; padding: 5px 12px; transform: rotate(-2deg); }
.next h2 { font: 700 27px/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.where { display: flex; gap: 12px; align-items: center; }
.bchip { min-width: 64px; padding: 7px 10px; border-radius: 14px; border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--edge);
  font: 700 22px/1 var(--f-display); text-align: center; color: #3b2316; font-variant-numeric: tabular-nums; flex: none; transform: rotate(-3deg); }
.where .bname { font-weight: 500; line-height: 1.3; }
.where .sub { color: var(--muted); font-size: 13px; }
.who { font-size: 14px; color: var(--ink); background: var(--soft); border-radius: 12px; padding: 6px 12px; justify-self: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
.stat { display: grid; gap: 2px; background: var(--soft); border-radius: 16px; padding: 10px 12px; }
.stat b { font: 700 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.status { border-radius: 16px; border: 2px solid var(--edge); padding: 10px 12px; font: 600 17px/1.3 var(--f-display);
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
.status .si { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--edge); }
.status .si svg { width: 20px; height: 20px; }
.status small { font: 400 13px/1.3 var(--f-body); opacity: .85; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.warn { background: var(--warn-bg); color: var(--warn); }
.status.late { background: var(--late-bg); color: var(--late); animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateX(-2px) rotate(-.4deg); } }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row .btn.primary { flex: 1 1 auto; }

/* start picker: two-option toggle */
.from { display: grid; gap: 8px; width: 100%; }
.from > .eyebrow { background: var(--soft); color: var(--ink); transform: none; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 5px; border: 2px solid var(--edge); border-radius: 18px; background: var(--soft); }
.seg button { border: 0; border-radius: 13px; background: transparent; padding: 8px 12px; cursor: pointer; display: grid; gap: 1px; text-align: start; min-width: 0; transition: background .15s; }
.seg button b { font: 600 15px/1.2 var(--f-display); }
.seg button span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.seg button[aria-checked="true"] { background: var(--grape); color: var(--grape-ink); box-shadow: 0 2px 0 var(--edge); }
.seg button[aria-checked="true"] span { color: inherit; opacity: .85; }
.seg button:disabled { cursor: default; opacity: .5; }
.from select { width: 100%; border: 2px solid var(--edge); border-radius: 14px; padding: 8px 10px; background: var(--card); }

/* day + timeline */
section.block { display: grid; gap: 12px; min-width: 0; }
section.block > h3 { font: 700 21px/1.2 var(--f-display); margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
section.block > h3 .note { font: 400 13px var(--f-body); }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.days button { border: 2px solid var(--edge); background: var(--card); border-radius: 999px; padding: 5px 14px; cursor: pointer; white-space: nowrap; font: 600 14px/1.4 var(--f-display); box-shadow: 0 2px 0 var(--edge); }
.days button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.days button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); margin-inline-start: 6px; vertical-align: middle; }
ol.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.cls { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--edge); border-radius: 18px; box-shadow: var(--stick-sm);
  padding: 10px 12px; cursor: pointer; text-align: start; width: 100%; transition: transform .1s; }
.cls:hover { transform: translateY(-1px) rotate(-.3deg); }
.cls.past { opacity: .55; box-shadow: none; }
.cls.now { background: var(--soft); box-shadow: 0 0 0 3px var(--lemon), var(--stick-sm); }
.cls .t { font: 600 16px/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.cls .t small { display: block; color: var(--muted); font: 400 13px var(--f-body); }
.cls .ti { min-width: 0; }
.cls .ti b { display: block; font-weight: 500; overflow-wrap: anywhere; }
.cls .ti span { color: var(--muted); font-size: 13px; }
.cls .bchip { min-width: 52px; font-size: 17px; padding: 5px 8px; }
.gap { margin-inline-start: 28px; border-inline-start: 3px dotted var(--coral); padding: 8px 0; padding-inline-start: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.gap.tight { color: var(--late); font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 2px solid var(--edge); background: var(--card); border-radius: 999px; padding: 3px 12px; font: 500 13px var(--f-display); color: var(--ink); cursor: pointer; box-shadow: 0 2px 0 var(--edge); }
.chip svg { width: 15px; height: 15px; }
.empty { color: var(--muted); padding: 14px; border: 2px dashed var(--muted); border-radius: 18px; text-align: center; font-family: var(--f-display); }

/* search */
.search input { width: 100%; border: 2px solid var(--edge); background: var(--card); border-radius: 999px; padding: 11px 18px; box-shadow: var(--stick-sm); font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.results { display: grid; gap: 8px; }
.res { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--edge); border-radius: 16px; padding: 8px 12px; cursor: pointer; text-align: start; width: 100%; box-shadow: 0 2px 0 var(--edge); }
.res .bchip { min-width: 52px; font-size: 16px; padding: 4px 6px; }
.res span { color: var(--muted); font-size: 12px; display: block; }
.pchip { background: var(--grape) !important; color: #ffffff !important; display: grid; place-items: center; }
.pchip svg { width: 20px; height: 20px; }
.pchip.gatechip { background: var(--card) !important; color: var(--ink) !important; }
.pchip.shuttle { background: #8c2335 !important; }

/* map */
.mapbox { position: relative; height: min(58vh, 560px); min-height: 330px; background: var(--paper); border: 2px solid var(--edge); border-radius: 26px; box-shadow: var(--stick); overflow: hidden; touch-action: none; }
.mapbox svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.mapbox svg.drag { cursor: grabbing; }
.maptools { position: absolute; top: 12px; inset-inline-start: 12px; display: grid; gap: 8px; }
.maptools button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--edge); background: var(--card); cursor: pointer; font: 700 20px/1 var(--f-display); display: grid; place-items: center; box-shadow: 0 2px 0 var(--edge); }
.maptools button:active { transform: translateY(2px); box-shadow: none; }
.navbar { position: absolute; top: 12px; inset-inline-start: 64px; inset-inline-end: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  background: var(--card); border: 2px solid var(--edge); border-radius: 20px; box-shadow: 3px 4px 0 var(--edge); padding: 8px 10px; }
.navbar .arrow { width: 52px; height: 52px; border-radius: 50%; background: var(--coral); color: var(--coral-ink); border: 2px solid var(--edge); display: grid; place-items: center; }
.navbar .arrow svg { width: 30px; height: 30px; transition: transform .25s ease-out; }
.navbar.done .arrow { background: var(--mint); }
.navbar b { display: block; font: 700 19px/1.2 var(--f-display); }
.navbar span { display: block; font-size: 13px; color: var(--muted); line-height: 1.3; }
@media (max-width: 899px) { body.walking .mapcol { order: -1; } body.walking .mapbox { height: 68vh; } } /* phone: the map comes first while walking */
.you .cone { fill: var(--route); opacity: .4; }
.legend { position: absolute; bottom: 10px; inset-inline-end: 10px; background: var(--card); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 20px); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--route); vertical-align: middle; margin-inline-end: 4px; }
.legend i.est { border-top: 2px dashed var(--muted); }
.legend .sk { display: inline-block; width: 9px; height: 9px; background: #8c2335; border-radius: 2px; margin-inline-end: 4px; vertical-align: middle; }
.legend .gk { display: inline-block; width: 9px; height: 9px; border: 1.5px solid var(--ink); border-radius: 2px; margin-inline-end: 4px; vertical-align: middle; }
#m-walk path { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.w-foot { stroke: var(--walk); stroke-width: 3.5; }
.w-road { stroke: var(--road); stroke-width: 6; }
.w-steps { stroke: var(--walk); stroke-width: 3.5; stroke-dasharray: 2 2; }
.b-shape { stroke: var(--bldg-edge); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.lot { fill: color-mix(in srgb, var(--coral) 14%, transparent); stroke: var(--coral); stroke-width: 1.5; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; }
.b-other { fill: var(--bldg); stroke: var(--bldg-edge); stroke-opacity: .45; stroke-width: 1; vector-effect: non-scaling-stroke; }
.b-est { fill: color-mix(in srgb, var(--card) 60%, transparent); stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.b-target { stroke: var(--route) !important; stroke-width: 3.5 !important; }
.lbl { font-family: var(--f-display); font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.route-casing { fill: none; stroke: var(--card); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.route { fill: none; stroke: var(--route); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-dasharray: 1 10; stroke-width: 7; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -22; } }

/* popup over a tapped building */
.popup { position: absolute; z-index: 3; transform: translate(-50%, calc(-100% - 14px)); width: max-content; max-width: min(280px, calc(100% - 16px));
  background: var(--card); border: 2px solid var(--edge); border-radius: 18px; padding: 12px; box-shadow: var(--stick-sm); display: grid; gap: 10px; animation: popin .25s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes popin { from { scale: .9; } }
.popup.below { transform: translate(-50%, 14px); }
.popup::after { content: ""; position: absolute; left: calc(50% + var(--arrow, 0px) - 8px); bottom: -9px; width: 14px; height: 14px; background: var(--card);
  border: solid var(--edge); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.popup.below::after { bottom: auto; top: -9px; transform: rotate(225deg); }
.pop-head { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; }
.pop-head .bchip { min-width: 48px; font-size: 17px; padding: 5px 8px; }
.pop-t { min-width: 0; display: grid; line-height: 1.3; }
.pop-t b { font: 600 16px/1.25 var(--f-display); }
.pop-t span { font-size: 12px; color: var(--muted); }
.pop-x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 2px; }
.popup .btn { width: 100%; }

footer { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .route { stroke-dasharray: none; } }
</style>

<div class="wrap" id="app">
  <div class="panel">
    <header class="top">
      <svg class="sun" viewBox="0 0 64 64" aria-hidden="true">
        <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <path d="M32 3v8M32 53v8M3 32h8M53 32h8M11.5 11.5l5.7 5.7M46.8 46.8l5.7 5.7M11.5 52.5l5.7-5.7M46.8 17.2l5.7-5.7"/>
        </g>
        <circle cx="32" cy="32" r="15" fill="#ffb27a" stroke="#3b2316" stroke-width="3"/>
        <circle cx="27" cy="30" r="2" fill="#3b2316"/><circle cx="37" cy="30" r="2" fill="#3b2316"/>
        <path d="M26 36q6 5 12 0" fill="none" stroke="#3b2316" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="23" cy="35" r="2.4" fill="#ffdcdc"/><circle cx="41" cy="35" r="2.4" fill="#ffdcdc"/>
      </svg>
      <div class="hello"><h1 id="hello">היי!</h1><p id="hello-sub"></p></div>
    </header>

    <article class="next" id="next" aria-live="polite"></article>

    <section class="block">
      <h3><span id="day-title">היום</span><span class="note" id="day-sum"></span></h3>
      <div class="days" id="days" role="group" aria-label="בחירת יום"></div>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section class="block search">
      <h3>לאן הולכים?</h3>
      <input id="q" type="search" placeholder="504, ספרייה, קפה, כספומט, הסעות…" autocomplete="off">
      <div class="results" id="results"></div>
    </section>

    <footer>פרויקט סטודנטים, לא אתר רשמי של האוניברסיטה. מפה: © תורמי OpenStreetMap (ODbL). מספרי בניינים, תחנות הסעות, חניונים וחלק מבתי הקפה לפי מפת הקמפוס. מיקום מסומן בקו מקווקו הוא הערכה (בדרך כלל עד 30 מ').</footer>
  </div>

  <div class="mapcol">
    <div class="mapbox" id="mapbox">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="מפת הקמפוס">
        <g id="m-base"></g><g id="m-walk"></g><g id="m-bldg"></g><g id="m-route"></g><g id="m-poi"></g><g id="m-lbl"></g><g id="m-top"></g>
      </svg>
      <div class="maptools">
        <button type="button" id="z-in" aria-label="הגדלה">+</button>
        <button type="button" id="z-out" aria-label="הקטנה">−</button>
        <button type="button" id="z-fit" aria-label="התאמה למסלול"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="navbar" id="navbar" hidden aria-live="polite">
        <div class="arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 17-7-4-7 4 7-17Z" fill="currentColor" stroke="var(--edge)" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
        <div><b id="nav-main"></b><span id="nav-sub"></span></div>

  // offline: keep the copy saved on this phone
}

/* ---------- boot ---------- */
drawBase();
rebuildSchedule();
fitCampus();
render();

loadCalendar();
setInterval(loadCalendar, 30 * 60000); // pick up schedule changes while the page stays open
setInterval(() => { const d = new Date(); if (!sameDay(d, selectedDay || d) && !focusOcc) selectedDay = null; rebuildSchedule(); render(); }, 30000);
$("mapbox").append(popup);
new ResizeObserver(() => view && setView(view)).observe($("mapbox"));
</script>
